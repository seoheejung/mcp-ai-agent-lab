<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Backend Diagnostics Phase 3 MCP Server verification" />
    <title>Backend Diagnostics / Phase 3</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="masthead">
        <p class="eyebrow">MCP &amp; AI AGENT LAB / 03</p>
        <h1>BACKEND<br />DIAGNOSTICS</h1>
        <p class="subtitle">PHASE 3 / MCP SERVER TOOL VERIFICATION</p>
      </header>

      <section class="panel" aria-labelledby="verification-title">
        <h2 id="verification-title">MCP 검증</h2>
        <p class="helper">stdio MCP Server의 Tool Discovery와 세 Read-only Tool Call을 실행합니다.</p>
        <button id="verify-mcp" type="button">RUN MCP VERIFICATION</button>
      </section>

      <section class="panel" aria-labelledby="result-title" aria-live="polite">
        <div class="result-heading">
          <h2 id="result-title">실행 결과</h2>
          <span id="run-state" class="status-chip">READY</span>
        </div>
        <p id="result-summary" class="empty-state">검증을 실행하면 실제 MCP Discovery와 Tool Call 결과를 표시합니다.</p>
        <div id="verification" hidden>
          <article class="execution-card" aria-labelledby="discovery-title">
            <h3 id="discovery-title">TOOL DISCOVERY</h3>
            <pre id="tool-discovery"></pre>
          </article>
          <article class="execution-card" aria-labelledby="calls-title">
            <h3 id="calls-title">TOOL CALLS</h3>
            <pre id="tool-calls"></pre>
          </article>
          <p id="end-to-end" class="report-summary"></p>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
